<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-label="Bucket hat e viseiras">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b43c64" stop-opacity="0.22" />
      <stop offset="1" stop-color="#b43c64" stop-opacity="0.06" />
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#b43c64" stop-opacity="0.16" />
      <stop offset="1" stop-color="#b43c64" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="900" height="1100" fill="url(#bg)" />
  <rect width="900" height="1100" fill="url(#glow)" />

  <!-- bucket hat -->
  <g fill="none" stroke="#7d1535" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M300 520c10-120 80-180 150-180s140 60 150 180" />
    <path d="M250 560c40 60 120 90 200 90s160-30 200-90" />
    <path d="M210 585c95 55 160 70 240 70s145-15 240-70" />
  </g>

  <!-- label -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" fill="#2a1520" opacity="0.7">
    <text x="60" y="1030" font-size="26" letter-spacing="3" style="text-transform:uppercase">Bucket hat e viseiras</text>
  </g>
</svg>
